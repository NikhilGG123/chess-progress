name: CI

# Every push and pull request: lint, formatting, types, unit tests and a
# production build. The database tests skip themselves here -- they need
# credentials, and CI has none on purpose. They run locally against a real
# project, inside transactions that roll back.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The build never talks to Supabase; it only needs the names set.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
